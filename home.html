<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <link rel="stylesheet" href="./style.css" />
    <title>Home</title>
  </head>
  <body class="bg-gradient-to-r from-indigo-400 to-cyan-400">
    <div class="container mx-auto min-h-screen p-5">
      <!-- Header Section -->
      <div
        class="flex flex-row justify-between items-center px-4 py-4 shadow-md rounded-lg"
      >
        <h1 class="text-3xl font-extrabold text-white tracking-wide">
          Typing Master
        </h1>
        <button
          id="logOut"
          class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105"
        >
          LogOut
        </button>
      </div>

      <!-- Introduction Section -->
      <div class="flex flex-col items-center justify-center mt-8">
        <p class="text-lg font-medium text-white text-center">
          Want to test your skill? Type as fast as you can!
        </p>
      </div>

      <!-- Typing Test Section -->
      <div
        class="w-full px-6 mt-10 flex flex-col items-center justify-center space-y-6"
      >
      <div class="flex flex-col justify-end items-end px-2 py-2">
        <span class="text-gray-200 text-2xl font-bold bg-gray-800 px-4 py-2 rounded-md shadow-md" id="timer">30s</span>
      </div>
        <!-- Display Text -->
        <div
          id="displayText"
          class="block text-2xl font-mono p-6 break-words leading-relaxed w-full max-w-3xl"
        ></div>
        <button
          id="changeParagraph"
          class="bg-[#00aeff] hover:bg-[#00aeff]/90 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105"
        >
          Change
        </button>
        <!-- Input Box -->

        <textarea
          id="wordBox"
          class="w-full max-w-3xl h-48 p-4 text-2xl text-white placeholder-gray-200 border border-white/50 rounded-lg focus:ring-2 focus:ring-white/50 focus:outline-none resize-none bg-transparent caret-whitesmoke"
          placeholder="Type something beautiful..."
          spellcheck="false"
        ></textarea>
        <p
          class="text-lg font-medium text-[#fbfb3c] text-center"
          id="result"
        ></p>
        <!-- Restart Button -->
        <div class="flex justify-center">
          <button
            id="restart"
            class="bg-[#00aeff] hover:bg-[#00aeff]/90 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 my-3"
          >
            Restart
          </button>
        </div>
      </div>
      <hr />
      <!-- Leaderboard Section -->
      <div class="flex flex-col items-center justify-center mt-12">
        <h2 class="text-3xl font-bold text-white tracking-wide">LeaderBoard</h2>
        <div
          id="leaderBoard"
          class="flex flex-col w-full max-w-3xl mt-4 bg-white p-4 rounded-lg shadow-md space-y-3"
        ></div>
      </div>
    </div>

    <script src="./word.js"></script>
  </body>
</html>
