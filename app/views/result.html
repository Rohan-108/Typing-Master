<div  ng-show="!isdata" class="container mx-auto p-6 text-white bg-[#0f1515] min-h-screen max-w-screen-xl flex flex-col items-center justify-center">
  <h1 class="w-full h-full flex flex-col items-center justify-center text-2xl">No Result to show yet!</h1>
</div>


<div ng-show="isdata" class="container mx-auto p-6 text-white bg-[#0f1515] min-h-screen max-w-screen-xl">
  <div class="flex items-center justify-between max-w-screen-xl mb-3 ">

    <h1 class="text-2xl font-bold text-center text-white self-center">Typing Test Results</h1>
    <button type="button" class="text-white bg-yellow-700 hover:bg-yellow-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center"
    ng-click="goToPage('test')"
    ng-show="user"
    >Retake Test</button>
  </div>
  
    <!-- WPM Chart -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-screen-xl mx-auto mb-8">
      <div class="w-full h-[300px]">
        <canvas id="chart"></canvas>
      </div>
    </div>
  
    <!-- Stats Section -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full mx-auto">
      <h2 class="text-2xl font-bold mb-4 text-center">Final Statistics</h2>
      <div class="grid grid-cols-2 gap-4 text-lg">
        <div class="bg-gray-700 p-4 rounded-md text-center">
          <h3 class="font-bold">Final WPM</h3>
          <p class="text-3xl font-bold">{{ wpm }}</p>
        </div>
        <div class="bg-gray-700 p-4 rounded-md text-center">
          <h3 class="font-bold">Accuracy</h3>
          <p class="text-3xl font-bold">{{ accuracy }}%</p>
        </div>
      </div>
    </div>
  </div>
