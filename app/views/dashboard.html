<div class="container mx-auto p-6 min-h-screen max-w-screen-xl mx-auto bg-[#0f1515] shadow-md rounded-lg p-6 text-white">
    <h1 class="text-2xl font-bold mb-4">User Dashboard</h1>

    <!-- User Info -->
    <div class="p-4 rounded mb-6">
      <h2 class="text-xl font-semibold mb-2">User Details</h2>
      <p><span class="font-semibold">Email:</span> <span id="userEmail">{{user}}</span></p>
    </div>

    <!-- Highest WPM -->
    <div class=" p-4 rounded mb-6">
      <h2 class="text-xl font-semibold mb-2">Highest WPM</h2>
      <p id="highestWPM" class="text-lg font-bold">{{highestWpm}} wpm</p>
    </div>

    <!-- Last 7 Days Chart -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-xl w-full max-w-screen-xl mx-auto mb-8">
        <div class="w-full h-[300px]">
          <canvas id="dashChart"></canvas>
        </div>
      </div>
  </div>
