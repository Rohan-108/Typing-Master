<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Project</title>
</head>
<body class="bg-gradient-to-r from-indigo-400 to-cyan-400">
    <div class="container mx-auto">
        <!-- Welcome Heading -->
        <h1 class="text-4xl font-extrabold text-center text-white mt-5 tracking-wide">😁 Welcome 😁</h1>
      
        <!-- Sign-Up Form Section -->
        <div class="flex items-center justify-center mt-10 flex-col">
          <form id="signUpForm" class="w-full max-w-md bg-white p-6 rounded-lg shadow-lg">
            <!-- Username Input -->
            <div class="mb-6">
              <label for="username" class="block text-sm font-semibold text-gray-700">Username</label>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-base" 
                required>
            </div>
      
            <!-- Email Input -->
            <div class="mb-6">
              <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-base" 
                required>
            </div>
      
            <!-- Password Input -->
            <div class="mb-6">
              <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-base" 
                required>
            </div>
      
            <!-- Sign-Up Button -->
            <div>
              <button 
                type="submit" 
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-md shadow-md transition-transform transform hover:scale-105" 
                id="signButton">
                SignUp
              </button>
            </div>
          </form>
      
          <!-- Login Link -->
          <div class="mt-4">
            <p class="text-center text-white">
              Already have an account? 
              <a href="login.html" class="text-white font-semibold underline">Login</a>
            </p>
          </div>
        </div>
      </div>
      
    <script src="./index.js"></script>
</body>
</html>
