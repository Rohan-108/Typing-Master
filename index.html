<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/" />
    <script type="module" src="node_modules/angular/angular.js"></script>
    <script type="module" src="node_modules/@uirouter/angularjs/release/angular-ui-router.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <script type="module" src="node_modules/angularjs-toaster/toaster.min.js"></script>
    <script type="module" src="node_modules/angular-animate/angular-animate.min.js"></script>
    <link rel="stylesheet" href="node_modules/angularjs-toaster/toaster.min.css"/>
    <script src="
    https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js
    "></script>
    <link rel="stylesheet" href="./style.css" />
    <title>Angular Setup</title>
</head>
<!-- bg-gradient-to-r from-indigo-400 to-cyan-400 -->
<body ng-app="myApp" class="bg-[#0f1515]" ng-controller="mainController">
    <div ng-include="'app/views/navbar.html'"></div>
    <div ui-view class="flex flex-col items-center">
    </div>

    <toaster-container
     toaster-options="{
        'time-out':1000,
        'position-class':'toast-bottom-right',
        'close-button':true
     }"
    ></toaster-container>
    <script type="module" src="app/app.js"></script>
    <script type="module" src="app/utils.js"></script>
    <script type="module" src="app/controllers/signup.js"></script>
    <script type="module" src="app/controllers/login.js"></script>
    <script type="module" src="app/controllers/home.js"></script>
    <script type="module" src="app/controllers/main.js"></script>
    <script type="module" src="app/validators.js"></script>
    <script type="module" src="app/services/auth.js"></script>
    <script type="module" src="app/services/shared.js"></script>
    <script type="module" src="app/controllers/typing.js"></script>
    <script type="module" src="app/controllers/result.js"></script>
    <script type="module" src="app/controllers/dashboard.js"></script>
    <script type="module" src="app/services/db.js"></script>
</body>
</html>
